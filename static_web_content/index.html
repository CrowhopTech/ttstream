<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTStream Audio</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --fg: #e8e8e8;
            --accent: #8b5cf6;
            --card: #1a1a2e;
            --border: #2a2a3e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 2.5rem 2rem;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }

        .status-waiting {
            display: block;
            color: #888;
            font-size: 0.85rem;
            font-family: ui-monospace, monospace;
            margin-bottom: 1rem;
        }

        .player-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        audio {
            width: 100%;
            border-radius: 10px;
            outline: none;
        }

        .footer {
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: #555;
        }

        .footer .source {
            color: var(--accent);
        }

        .keepalive-status {
            font-size: 0.7rem;
            color: var(--accent);
            min-height: 1rem;
        }

        .keepalive-status .active {
            color: #22c55e;
        }

        /* Section divider */
        .section-divider {
            display: flex;
            align-items: center;
            margin: 2rem 0;
            padding: 0 0.25rem;
        }

        .section-divider::before,
        .section-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .section-divider-line {
            display: inline-block;
            padding: 0 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            user-select: none;
        }

        .status-messages-section {
            text-align: left;
        }

        .status-card {
            background: var(--card);
            border: none;
            border-radius: 20px;
            padding: 2rem 1.75rem;
            margin-bottom: 1.5rem;
        }

        .status-card h2 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 0.5rem;
            letter-spacing: 0.01em;
        }

        .status-card .status-text {
            font-family: ui-monospace, monospace;
            font-size: 0.8rem;
            color: #888;
            margin: 0;
            background: none;
            border: none;
            border-radius: 0;
            padding: 0;
        }

        .status-card .status-not-connected {
            font-family: ui-monospace, monospace;
            font-size: 0.8rem;
            color: #555;
            font-style: italic;
        }

        .status-list {
            list-style: none;
            padding: 0;
        }

        .status-item {
            list-style: none;
            padding: 1rem 0;
            background: none;
            border: none;
            border-radius: 0;
        }

        .status-text {
            font-family: ui-monospace, monospace;
            font-size: 0.75rem;
            color: #888;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>TTStream Audio</h1>
        <p class="subtitle">Powered by icecast+HLS</p>
        <div class="player-card">
            <audio id="player" controls preload="auto" src="http://192.168.128.30:8069/stream.mp3"></audio>
        </div>
        <div class="section-divider">
            <span class="section-divider-line">Component Status</span>
        </div>
        <div class="status-messages-section" id="status-section">
            <div class="status-card" id="status-card-openai">
                <h2 id="status-card-title-openai">OpenAI Text Generator Status</h2>
                <span class="status-waiting" id="status-waiting-openai" style="display:none"></span>
                <ul class="status-list" id="status-list-openai"></ul>
            </div>
            <div class="status-card" id="status-card-qwen">
                <h2 id="status-card-title-qwen">Qwen TTS Speaker Status</h2>
                <span class="status-waiting" id="status-waiting-qwen" style="display:none"></span>
                <ul class="status-list" id="status-list-qwen"></ul>
            </div>
        </div>
        <div class="footer">
            <span>Stream: <span class="source">http://192.168.128.30:8069/stream.mp3</span></span>
            <span class="keepalive-status"><span class="active">●</span> Keepalive: active</span>
        </div>
    </div>

    <script>
        // TTStream Audio - Keepalive
        const ORCHESTRATOR_ADDR = 'http://192.168.128.30:8888';
        const KEEPALIVE_INTERVAL = 1000;
        const STATUS_INTERVAL = 1000;

        async function refreshStatus() {
            try {
                const response = await fetch(ORCHESTRATOR_ADDR + "/webpage_status.json", { method: "GET" })
                const json = await response.json();
                renderStatusList(json);
            } catch (e) {
                renderStatusList({});
            }
        }

        function renderStatusList(data) {
            const waitingEl = document.getElementById('status-waiting-openai');
            const waitingQwen = document.getElementById('status-waiting-qwen');
            const listOpenai = document.getElementById('status-list-openai');
            const listQwen = document.getElementById('status-list-qwen');
            if (!listOpenai) return;

            const openaiStatus = data.openai_text_generator_status || null;
            const hasStatus = openaiStatus && openaiStatus.status;

            if (hasStatus) {
                waitingEl.style.display = 'none';
                waitingQwen.style.display = 'none';

                listOpenai.innerHTML = '';
                listQwen.innerHTML = '';

                function renderEntry(container, statusData) {
                    const item = document.createElement('li');
                    item.className = 'status-item status-card';
                    const text = document.createElement('span');
                    text.className = 'status-text';
                    text.textContent = statusData.status;
                    if (statusData.as_of) {
                        const secondsAgo = Math.max(0, Math.floor(Date.now() / 1000 - statusData.as_of));
                        const timeSpan = document.createElement('span');
                        timeSpan.className = 'status-text time-ago';
                        if (secondsAgo == 0) {
                            timeSpan.textContent = ' · Now'
                        } else {
                            timeSpan.textContent = ' · ' + secondsAgo + 's ago';
                        }
                        text.appendChild(timeSpan);
                    }
                    item.appendChild(text);
                    container.appendChild(item);
                }

                if (data.openai_text_generator_status) {
                    renderEntry(listOpenai, data.openai_text_generator_status);
                }
                if (data.qwen_tts_speaker_status) {
                    renderEntry(listQwen, data.qwen_tts_speaker_status);
                }
            } else {
                waitingEl.style.display = 'block';
                waitingEl.textContent = 'Waiting for status...';
                waitingQwen.style.display = 'block';
                waitingQwen.textContent = 'Waiting for status...';
            }
        }

        setInterval(refreshStatus, STATUS_INTERVAL);

        function pingOrchestrator() {
            const statusEl = document.querySelector('.keepalive-status .active');
            if (!statusEl) return;

            fetch(ORCHESTRATOR_ADDR + "/webpage-keepalive", { method: "POST" })
                .then(() => {
                    statusEl.classList.add('active');
                })
                .catch(() => {
                    statusEl.classList.remove('active');
                });
        }
        setInterval(pingOrchestrator, KEEPALIVE_INTERVAL);

        // Initial ping on page load
        pingOrchestrator();
    </script>
</body>

</html>
